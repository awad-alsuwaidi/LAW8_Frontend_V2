<div class="ui-overlay" (click)="close()">
  <div class="ui-modal ui-modal--sm" (click)="$event.stopPropagation()" role="dialog" aria-modal="true">
    <div class="ui-modal__head">
      <span class="ui-modal__icon ui-modal__icon--warning">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="10" y1="15" x2="10" y2="9"/><line x1="14" y1="15" x2="14" y2="9"/></svg>
      </span>
      <div class="ui-modal__text">
        <h3 class="ui-modal__title">{{ t('subscriptions.suspend.title') }}</h3>
        <p class="ui-modal__subtitle">{{ subscription | productLabel }} · {{ subscription.organizationName }}</p>
      </div>
      <button class="ui-modal__close" type="button" (click)="close()" [attr.aria-label]="t('common.cancel')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <form (ngSubmit)="submit()">
      <div class="ui-modal__body">
        @if (errorMessage) { <div class="ui-alert ui-alert--error">{{ errorMessage }}</div> }

        <div class="ui-field">
          <label class="ui-label" for="reason">{{ t('subscriptions.suspend.reasonLabel') }}</label>
          <textarea id="reason" class="ui-textarea" rows="3" name="reason" maxlength="500"
                    [(ngModel)]="reason" [placeholder]="t('subscriptions.suspend.reasonPlaceholder')"></textarea>
        </div>
      </div>

      <div class="ui-modal__foot">
        <button class="ui-btn ui-btn--ghost" type="button" (click)="close()" [disabled]="isLoading">{{ t('common.cancel') }}</button>
        <button class="ui-btn ui-btn--primary" type="submit" [disabled]="isLoading">
          {{ isLoading ? t('subscriptions.suspend.submitting') : t('subscriptions.suspend.submit') }}
        </button>
      </div>
    </form>
  </div>
</div>
