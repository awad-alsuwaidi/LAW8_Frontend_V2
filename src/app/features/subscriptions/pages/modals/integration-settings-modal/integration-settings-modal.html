<div class="ui-overlay" (click)="close()">
  <div class="ui-modal ui-modal--sm" (click)="$event.stopPropagation()" role="dialog" aria-modal="true">
    <div class="ui-modal__head">
      <span class="ui-modal__icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      </span>
      <div class="ui-modal__text">
        <h3 class="ui-modal__title">{{ integration.providerName }}</h3>
        <p class="ui-modal__subtitle">{{ subscription.organizationName }}</p>
      </div>
      <button class="ui-modal__close" type="button" (click)="close()" [attr.aria-label]="t('common.cancel')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <form (ngSubmit)="submit()">
      <div class="ui-modal__body">
        @if (errorMessage) { <div class="ui-alert ui-alert--error">{{ errorMessage }}</div> }
        @if (!integration.licensed) { <div class="ui-alert ui-alert--warning">{{ t('subscriptions.integrations.notLicensedHint') }}</div> }

        <div class="ui-field">
          <label class="ui-label">{{ t('integrations.syncMode') }}</label>
          <select class="ui-select" name="mode" [(ngModel)]="syncMode">
            @for (m of modes; track m) { <option [value]="m">{{ t('integrations.mode' + m) }}</option> }
          </select>
        </div>

        @if (syncMode !== 'Webhook') {
          <div class="ui-field">
            <label class="ui-label">{{ t('integrations.syncInterval') }}</label>
            <input class="ui-input" type="number" appPositiveInteger min="5" max="10080" step="1" name="interval" dir="ltr" [(ngModel)]="syncIntervalMinutes" />
            <span class="ui-hint">{{ t('integrations.syncIntervalHint') }}</span>
          </div>
        }

        <div class="ui-field">
          <label class="ui-label">{{ t('subscriptions.integrations.rateLimit') }}</label>
          <input class="ui-input" type="number" appPositiveInteger min="1" max="10000" step="1" name="rate" dir="ltr" [(ngModel)]="rateLimitPerMinute" />
        </div>
      </div>

      <div class="ui-modal__foot">
        <button class="ui-btn ui-btn--ghost" type="button" (click)="close()" [disabled]="isLoading">{{ t('common.cancel') }}</button>
        <button class="ui-btn ui-btn--primary" type="submit" [disabled]="isLoading || !isValid">
          {{ isLoading ? t('common.saving') : t('common.save') }}
        </button>
      </div>
    </form>
  </div>
</div>
