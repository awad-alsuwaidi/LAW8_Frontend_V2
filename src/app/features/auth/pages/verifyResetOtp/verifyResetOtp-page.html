<div class="otp-page">

  <!-- ================= LEFT SIDE ================= -->

  <section class="otp-section">

    <!-- Logo -->
    <div class="logo-wrapper">
      <img
        src="/assets/images/Logo.svg"
        alt="LAW8"
        class="law8-logo"
      />
    </div>

    <!-- OTP Card -->
    <div class="otp-card">

      <h1 class="otp-header">
        {{ translate('otp.title') }}
      </h1>

      <div class="otp-inputs">

        @for (
          digit of otp();
          track $index;
          let i = $index
        ) {

          <input
            #otpInput

            type="text"

            inputmode="numeric"

            pattern="[0-9]*"

            maxlength="1"

            autocomplete="one-time-code"

            class="otp-input"

            [value]="digit"

            (focus)="onOtpFocus($event)"

            (input)="onOtpInput($event, i)"

            (keydown)="onOtpKeyDown($event, i)"

            (paste)="onOtpPaste($event)"

            [autofocus]="i === 0"

            [attr.aria-label]="
              'OTP digit ' + (i + 1)
            "
          />

        }

      </div>

      <button
        type="button"
        class="verify-button"

        [disabled]="
          isLoading() ||
          !isOtpComplete()
        "

        (click)="verifyOtp()"
      >

        @if (isLoading()) {

          <span
            class="button-loader"
          ></span>

        } @else {

          <span>
            {{ translate('otp.verify') }}
          </span>

        }

      </button>

      <div class="otp-timer">
        {{ formattedTime }}
      </div>

      <button
        type="button"
        class="resend-button"

        [disabled]="
          remainingSeconds() > 0 ||
          isLoading()
        "

        (click)="resendCode()"
      >
        {{ translate('otp.sendAgain') }}
      </button>

      <div class="powered-by">
        {{ translate('otp.poweredBy') }}
      </div>

    </div>

  </section>


  <!-- ================= RIGHT SIDE ================= -->

  <section class="branding-section">

    <div class="branding-header">

      <button
        type="button"
        class="help-button"
      >
        {{ translate('login.help') }}
      </button>

      <app-language-switcher>
      </app-language-switcher>

    </div>

    <div class="branding-content">

      <h2>
        {{ translate('otp.heading') }}
      </h2>

      <p>
        {{ translate('otp.description') }}
      </p>

    </div>

  </section>

</div>
