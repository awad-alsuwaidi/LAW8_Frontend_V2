<div class="login-page" [attr.dir]="currentLanguage === 'ar' ? 'rtl' : 'ltr'">
  <section class="login-section">
    <div class="logo-wrapper">
    </div>

    <div class="login-content">
      <h1>{{ translate('login.title') }}</h1>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
        <div class="form-field">
          <label for="username">
            {{ translate('login.username') }}
            <span>{{ translate('login.required') }}</span>
          </label>

          <div class="input-wrapper">
            <input
              id="username"
              name="username"
              type="text"
              [(ngModel)]="userName"
              required
              autocomplete="username"
            />
          </div>
        </div>
        <div class="form-field password-field">
          <label for="password">
            {{ translate('login.password') }}
            <span>{{ translate('login.required') }}</span>
          </label>

          <div class="input-wrapper password-wrapper">
            <input
              id="password"
              name="password"
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="password"
              required
              autocomplete="current-password"
            />

            <button
              type="button"
              class="password-toggle"
              (click)="togglePassword()"
              aria-label="Toggle password visibility"
            >
              @if (showPassword) {
                <span><img src="assets/images/icons-eye.png" alt="" /></span>
              } @else {
                <span><img src="assets/images/icons-invisible.png" alt="" /></span>
              }
            </button>
          </div>
        </div>

        @if (errorMessage) {
          <div class="error-message">
            {{ errorMessage }}
          </div>
        }

        <div class="login-options">
          <label class="remember-wrapper">
            <input type="checkbox" name="rememberMe" [(ngModel)]="rememberMe" />

            <span class="custom-checkbox"></span>

            <span class="remember-text">
              {{ translate('login.rememberMe') }}
            </span>
          </label>
          <button type="button" class="forgot-password" >
            {{ translate('login.forgotPassword') }}
          </button>
        </div>
        <button type="submit" class="sign-in-button" [disabled]="isLoading">
          @if (isLoading) {
            <span class="button-loader"></span>
          } @else {
            <span>{{ translate('login.signIn') }}</span>
          }
        </button>
      </form>
      <div class="powered-by">
        {{ translate('login.poweredBy') }}
      </div>
    </div>
  </section>

  <section class="branding-section">
    <div class="branding-header">
      <button type="button" class="help-button">
        {{ translate('login.help') }}
      </button>

      <app-language-switcher></app-language-switcher>
    </div>

    <div class="branding-content">

      <h2>{{ translate('otp.heading') }}</h2>

      <p>
        {{ translate('otp.description') }}
      </p>
    </div>
  </section>
</div>
