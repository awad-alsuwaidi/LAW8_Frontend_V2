<div class="grid grid-cols-1 md:grid-cols-2 bg-white min-h-screen">
  <!-- Form Section -->
  <div class="w-full">
    <div class="px-6 sm:px-16 py-4">
      <img [src]="logoPath || defaultLogoPath" [alt]="'Law8 Logo'"  class="w-32 h-auto" />

    </div>
    <div class="h-[calc(100vh-5rem)] flex items-center justify-center px-4 sm:px-6">
      <div class="w-full sm:w-3/5">
        <router-outlet />
      </div>
    </div>
  </div>
<!-- طه طااهااا -->
  <!-- Side Image Section -->
  <div class="hidden md:flex bg-gradient-to-b from-primary to-yaleBlue flex-col">
    <div class="px-6 sm:px-16 py-4 flex justify-end items-center gap-4 sm:gap-10">
      <span class="text-sm text-white cursor-pointer">{{ "auth.help" | translate }}</span>
      <!-- <shared-language [darkMode]="true"/> -->
      <shared-language />
    </div>
    <div class="h-[calc(100vh-5rem)] flex items-center justify-center px-4 sm:px-6">
      <div class="text-center w-full sm:w-4/5">
        <img
          [srcset]="
            _router.url.includes('otp')
              ? '../../../../../assets/images/forgetpassword2.svg'
              : '../../../../../assets/images/forgetpassword.svg'
          "
          alt=""
          class="w-full max-w-[22.8125rem] mx-auto h-auto"
        />
      </div>
    </div>
  </div>
</div>
