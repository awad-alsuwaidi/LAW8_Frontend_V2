<div class="pager">
  <label class="pager__size">
    {{ t('common.rowsPerPage') }}
    <select class="ui-select pager__select" [ngModel]="pageSize" (ngModelChange)="setSize($event)">
      @for (n of pageSizes; track n) { <option [ngValue]="n">{{ n }}</option> }
    </select>
  </label>

  <span class="pager__count">{{ from }}–{{ to }} / {{ total }}</span>

  <div class="pager__nav">
    <button class="ui-btn ui-btn--ghost ui-btn--sm pager__btn" type="button" [disabled]="page <= 1" (click)="prev()" [attr.aria-label]="t('common.previous')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span class="pager__page">{{ page }} / {{ totalPages }}</span>
    <button class="ui-btn ui-btn--ghost ui-btn--sm pager__btn" type="button" [disabled]="page >= totalPages" (click)="next()" [attr.aria-label]="t('common.next')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>
</div>
