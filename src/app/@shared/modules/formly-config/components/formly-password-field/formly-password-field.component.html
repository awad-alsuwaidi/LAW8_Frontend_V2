<p-password
  [promptLabel]="' '"
  [weakLabel]="'common.weak' | translate"
  [mediumLabel]="'common.medium' | translate"
  [strongLabel]="'common.strong' | translate"
  [formControl]="formControl"
  [formlyAttributes]="field"
  [toggleMask]="true"
  [feedback]="props['feedback'] ?? true"
  [placeholder]="props['placeholder']"
  [styleClass]="props['class']"
>
  <ng-template pTemplate="footer">
    <div class="text-xs text-red-500 m-0 p-0">
      {{ "validation.password" | translate }}
    </div>
  </ng-template>
</p-password>
