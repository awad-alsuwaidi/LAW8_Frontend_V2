@if(emptyConfig){
<section>
    @if(emptyConfig.title||emptyConfig.addButton){

    <div class="flex p-2 rounded-t-lg bg-white mb-4 h-14 empty-title"
        [ngClass]="{'justify-between':emptyConfig.title,'justify-end':!emptyConfig.title}">
        @if(emptyConfig.title){

        <h1 class=" font-bold text-2xl text-colorsTextTextPrimary leading-9">{{emptyConfig.title |translate}}</h1>
        }
        @if(emptyConfig.addButton){

        <app-shared-button (onClick)="emptyConfig.addButton.command()" [requiredPermission]="emptyConfig.addPermission"
            [icon]="'icon-add-circle text-primary !text-2xl '" [label]="emptyConfig.addButton.label |translate"
            [styleClass]="'flex text-blue600 !text-sm !py-1 !px-0 !font-medium !leading-8'" />
        }

    </div>
    }
    <div class="flex justify-center items-center bg-white p-6 rounded-2xl min-h-[calc(100vh-200px)] empty-body"
        [class]="styleClass">
        <div>
            @if(withImage){
            }
            <div class="text-center">
                <p class="font-bold my-2  text-textSecondary text-sm">{{emptyConfig.messageTitle!|translate}}</p>
                <p class="text-textTertairy text-sm  font-medium">{{emptyConfig.description!|translate}}</p>
            </div>
        </div>
    </div>
</section>
}
