<div class="mx-auto px-2 sm:px-4 md:px-6 lg:px-8">
  <div class="flex flex-col sm:flex-row sm:flex-wrap lg:flex-nowrap items-center justify-between gap-2 sm:gap-4 lg:gap-6 w-full">

    <!-- Mobile Navigation Menu Button -->
    <div class="order-1 sm:order-1 lg:hidden flex-shrink-0">
      <button
        class="inline-flex items-center justify-center rounded-md bg-muted p-2 text-muted-foreground focus:outline-none focus:ring-2 focus:ring-inset focus:ring-primaryColor hover:bg-muted-foreground hover:text-muted"
        type="button" aria-expanded="false" (click)="toggleMobileMenu()">
        <i class="icon-menu text-lg"></i>
      </button>
    </div>

    <!-- Search bar -->
    <div class="order-2 sm:order-2 flex-1 min-w-0 w-full sm:w-auto lg:max-w-md">
      <app-advanced-search />
    </div>

    <!-- Profile menu -->
    <div class="order-3 sm:order-3 lg:order-3 flex flex-wrap sm:flex-nowrap items-center justify-end gap-2 sm:gap-4 lg:gap-6 w-full sm:w-auto">
      <app-notification class="flex-shrink-0" />
      <app-topbar-timer (onStopTimer)="onStopTimer($event)" class="flex-shrink-0" />
      <shared-language [showLabel]="false" class="flex-shrink-0" />
      <app-user class="flex-shrink-0" />
    </div>

  </div>

  <!-- Mobile menu -->
  <app-navbar-mobile class="lg:hidden mt-2"></app-navbar-mobile>
</div>
