<form [formGroup]="formly" (ngSubmit)="onSubmit()"
    class="bg-white p-6 md:p-8 rounded-2xl shadow-lg w-full max-w-3xl mx-auto space-y-6">



    <formly-form [form]="formly" [fields]="formlyFields" [model]="formlyModel" [options]="formlyOptions"
        class="grid grid-cols-1 md:grid-cols-2 gap-6">
    </formly-form>


    <div class="flex flex-col-reverse sm:flex-row justify-end gap-4 pt-4 border-t border-gray-100">
        <app-shared-button
            styleClass="bg-white border border-grey300 text-grey600 hover:bg-grey50 transition-all px-6 py-2 rounded-xl shadow-sm text-base font-medium"
            [label]="'common.cancel' | translate" (onClick)="_dynamicDialogRef.close()">
        </app-shared-button>
         <app-shared-button
  styleClass="bg-primary text-white hover:bg-blue-600 transition-all px-6 py-2 rounded-xl shadow-md text-base font-semibold"
  [label]="isSubmitting ? ('auth.loading' | translate) : ('common.update' | translate)"
  [btnType]="'submit'"
  [disabled]="isSubmitting">
</app-shared-button>

    </div>
</form>
