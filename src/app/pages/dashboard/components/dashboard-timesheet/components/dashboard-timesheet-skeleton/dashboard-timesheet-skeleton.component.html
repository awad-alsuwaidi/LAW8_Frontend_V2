<section class="p-4 bg-white rounded-2xl flex flex-col gap-4 items-center">
    <div>
        <p-skeleton shape="circle" size="7rem" />
    </div>
    <div class="grid lg:grid-cols-2 gap-4">
        @for (item of [].constructor(6); track $index) {

            <div class="py-2 px-3 rounded-lg bg-grey50">
                <p-skeleton height="0.5rem" width="1.5rem" styleClass="mb-2" borderRadius="16px" />
                <p-skeleton width="10rem" styleClass="mb-2" borderRadius="16px" />
            </div>
        }
    </div>

</section>
