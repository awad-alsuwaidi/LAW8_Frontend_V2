<form class="bg-surfaceLevel2 border-y border-grey100 p-4" [formGroup]="formly" (ngSubmit)="onSubmit()">

    @if(isLoading) {
    <div class="space-y-4">
        <div class="h-12 bg-gray-200 rounded-lg animate-pulse"></div>
        <div class="h-12 bg-gray-200 rounded-lg animate-pulse"></div>

        <div class="h-12 bg-gray-200 rounded-lg animate-pulse"></div>
        <div class="h-12 bg-gray-200 rounded-lg animate-pulse"></div>
        <div class="h-12 bg-gray-200 rounded-lg animate-pulse"></div>

        <div class="flex gap-4 justify-end mt-4">
            <div class="h-12 w-32 bg-gray-200 rounded-lg animate-pulse"></div>
            <div class="h-12 w-32 bg-gray-200 rounded-lg animate-pulse"></div>
            <div class="h-12 w-40 bg-gray-200 rounded-lg animate-pulse"></div>
        </div>
    </div>
    }

    @if(!isLoading) {
    <formly-form [form]="formly" [fields]="formlyFields" [model]="formlyModel" />
    <div class="flex max-sm:flex-col gap-4 justify-end mt-4">
        <app-shared-button [btnType]="'button'"
            styleClass="bg-white border border-grey500 text-grey500 px-8 py-3 text-lg font-medium h-12 leading-5"
            [label]="'common.cancel' | translate" (onClick)="_dynamicDialogRef.close()" />
        <app-shared-button [btnType]="'button'"
            styleClass="bg-white border border-primary text-primary px-8 py-3 text-lg font-medium h-12 leading-5"
            [label]="'common.reset' | translate" (onClick)="reset()" />
        <app-shared-button [btnType]="'submit'"
            styleClass="bg-primary text-white px-8 py-3 text-lg font-medium h-12 leading-5"
            [label]="'common.applyFilters' | translate" />
    </div>
    }
</form>
