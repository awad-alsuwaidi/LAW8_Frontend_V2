<div>
  <formly-form [form]="formly" [fields]="formlyFields" [model]="formlyModel" />
</div>

@if ((formlyModel | objToArrWithValues).length > 0) {
  <div class="px-6 py-2 bg-grey50 my-4 flex justify-between">
    <div class="flex gap-2">
      <span class="text-sm text-greyscale600 font-medium me-4 self-center">
        {{ "common.applied" | translate }}
      </span>

      @for (
        chip of getFilterChips();
        track chip.key + "_" + (chip.value?.id || chip.value)
      ) {
        <p-chip
          [label]="chip.label"
          [removable]="true"
          (onRemove)="updateFilter(chip.key, chip.value)"
        />
      }
    </div>
    <div>
      <app-shared-button
        [btnType]="'button'"
        styleClass=" text-textSecondary !px-0 !py-0 text-xs font-medium"
        [label]="'common.reset' | translate"
        (onClick)="reset()"
      />
    </div>
  </div>
}
