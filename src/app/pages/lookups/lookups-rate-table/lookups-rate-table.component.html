@if(data.length === 0 && !searchText && !isLoading){

<app-shared-empty-section [emptyConfig]="emptyConfig" />

}@else{

<div class="grid grid-cols-6 gap-4">
  <div class="col-span-2">
    <div class="flex justify-between p-2 rounded-t-lg bg-white h-14">
      <h1 class="font-bold text-2xl text-colorsTextTextPrimary leading-9">
        {{ "Rates" }}
      </h1>

      <app-shared-button
        [icon]="'icon-add-circle text-primary !text-2xl '"
        [label]="'New Rate' | translate"
        [styleClass]="'flex text-blue600 !text-sm !py-1 !px-0 !font-medium !leading-8'"
        (onClick)="openRateEditor()" />
    </div>

    <div class="my-2">
      <app-shared-search (searchValueChange)="searchValueChange($event)" />
    </div>

    <div class="flex flex-col gap-2">

      @if(isLoading){
        <div class="flex flex-col gap-2">
          <div *ngFor="let _ of [1,2,3,4,5]" class="h-20 bg-grey100 rounded-lg animate-pulse"></div>
        </div>
      }@else{

        @for(rowData of data; track rowData.id){
          <a
            href="javascript:void(0)"
            (click)="openSubRate(rowData)"
            [class.active]="rowData.id === selectedRowId"
            class="flex justify-between items-center p-3 rounded-lg border transition duration-300 cursor-pointer
            hover:bg-gray-50 hover:border-primary relative
            before:h-0 before:w-0 before:bg-primary before:rounded-full before:absolute
            before:top-3 before:-start-1.5 before:transition-all before:duration-300 before:ease-in-out
            hover:before:h-4/6 hover:before:w-1
            [&.active]:bg-blue-100 [&.active]:border-blue-500"
            [ngClass]="{ 
              'bg-red-50 border-red-300': rowData.isActive === false, 
              'bg-white border-gray-200': rowData.isActive === true 
            }">

            <div class="flex justify-between gap-2">
              <div>
                <h1 class="font-bold text-sm text-textSecondary mb-2 transition-colors duration-300 ease-in-out">
                  {{ rowData.nameEn }}
                </h1>
                <p class="font-medium text-grey500 text-xs">
                  {{ rowData.nameAr }}
                </p>
              </div>
            </div>

            <div>
              <p class="font-bold text-xs text-colorsTextTextPrimary mb-2 transition-colors duration-300 ease-in-out text-end">
                <app-shared-status
                  [statusConfig]="statusConfig"
                  [data]="rowData.isActive"
                  [label]="(rowData.isActive ? 'common.active' : 'common.inactive') | translate" />
              </p>
            </div>
          </a>
        }

        <p-paginator
          [dir]="'ltr'"
          (onPageChange)="onPageChange($event)"
          [first]="(filterOptions.pageNum - 1) * filterOptions.pagSize"
          [rows]="filterOptions.pagSize"
          pageLinkSize="3"
          [totalRecords]="totalCount"
          [showCurrentPageReport]="true"
          currentPageReportTemplate="Total {totalRecords}" />
      }

    </div>
  </div>

  <div class="col-span-4">
    <router-outlet />
  </div>
</div>

}
