@if(isLoading){
<div class="space-y-4 animate-pulse">
    <div class="h-12 bg-gray-200 rounded"></div>
    <div class="h-12 bg-gray-200 rounded"></div>
    <div class="h-12 bg-gray-200 rounded"></div>
    <div class="h-12 bg-gray-200 rounded"></div>
    <div class="flex justify-end gap-4 mt-4">
        <div class="h-12 w-28 bg-gray-300 rounded"></div>
        <div class="h-12 w-28 bg-gray-300 rounded"></div>
    </div>
</div>}@else {
  <form [formGroup]="formly" (ngSubmit)="onSubmit()">
    <div class="bg-surfaceLevel2 border-y border-grey100 p-4">
      <formly-form
        [fields]="formlyFields"
        [model]="formlyModel"
        [options]="formlyOptions"
      />
    </div>
    <div class="flex justify-end gap-4 my-4 px-4">
      <app-shared-button
        styleClass="bg-white border border-grey500 text-grey500 px-8 py-3 text-lg font-medium h-12 leading-5"
        [label]="'common.cancel'|translate"
        (onClick)="_dynamicDialogRef.close()"
      />
      <app-shared-button
        styleClass="bg-primary text-white px-8 py-3 text-lg	font-medium h-12 leading-5"
        [label]="'common.save'|translate"
        [btnType]="'submit'"
        [isLoading]="isSubmitted"
      />
    </div>
  </form>

}
