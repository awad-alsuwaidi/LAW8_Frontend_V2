<section class='bg-white rounded-2xl px-6'>
    <h2 class="font-bold text-grey500 text-lg pt-6">{{ 'Users' | translate }}</h2>
    <app-security-users-filter (onFilter)="onFilter($event)" />

    @if(isLoading){
    <div class="w-full h-screen p-6 animate-pulse">
        <div class="overflow-x-auto">
            <table class="w-full border-collapse">
                <thead>
                    <tr>
                        <th class="px-4 py-3">
                            <div class="h-6 w-24 bg-gray-200 rounded"></div>
                        </th>
                        <th class="px-4 py-3">
                            <div class="h-6 w-32 bg-gray-200 rounded"></div>
                        </th>
                        <th class="px-4 py-3">
                            <div class="h-6 w-20 bg-gray-200 rounded"></div>
                        </th>
                        <th class="px-4 py-3">
                            <div class="h-6 w-28 bg-gray-200 rounded"></div>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    @for (i of [1,2,3,4,5,6,7,8]; track i) {
                    <tr>
                        <td class="px-4 py-4 border-t">
                            <div class="h-5 w-24 bg-gray-200 rounded"></div>
                        </td>
                        <td class="px-4 py-4 border-t">
                            <div class="h-5 w-32 bg-gray-200 rounded"></div>
                        </td>
                        <td class="px-4 py-4 border-t">
                            <div class="h-5 w-20 bg-gray-200 rounded"></div>
                        </td>
                        <td class="px-4 py-4 border-t">
                            <div class="h-5 w-28 bg-gray-200 rounded"></div>
                        </td>
                    </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>

    }
    @else {
    <app-shared-table [columns]="columns" [data]="data" [pagination]="pagination" (onPageChange)="onPageChange($event)"
        (onSort)="onSort($event)">
        <ng-template #customColumn let-rowData let-rowIndex="rowIndex">
            @for (item of rowData.groups; track $index) {
            @if($index<=6){ <span class="text-[11px] font-medium text-textTertairy px-2 py-0.5 bg-grey200 rounded-full"
                [class]="!$last?'me-3':''">{{item}}</span>
                }

                }
                @if(rowData.groups?.length>6){

                <span
                    class="text-[11px] font-medium text-textTertairy px-2 py-0.5 bg-grey200 rounded-full cursor-pointer"
                    (click)="openSecurityUserEditor(rowData)">
                    + {{rowData.groups?.length-6}}</span>
                }
        </ng-template>

        @if(hasPermission('Add_Role')){
        <ng-template #columnActions let-rowData let-rowIndex="rowIndex">
            <div class="font-medium text-sm text-textSecondary rounded-e-lg">
                <div class="flex gap-6">
                    <div class="cursor-pointer" (click)="openSecurityUserEditor(rowData)">
                        <i class="icon-security-user text-2xl"></i>
                    </div>
                </div>
            </div>
        </ng-template>
        }


    </app-shared-table>
    }
</section>
