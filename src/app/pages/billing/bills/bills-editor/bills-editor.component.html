<section>
  <h1 class="text-colorsTextTextPrimary font-bold text-2xl mb-1">
    {{ (billIdentifier() ? "Update Bill" : "Create Bill") | translate }}
  </h1>
  <form [formGroup]="formly" (ngSubmit)="onSubmit()">
    <app-bills-main-editor
      [formly]="formly"
      [model]="formlyModel"
      (onMatterChange)="onMatterChange($event)"
    />
    <app-bills-time-fees-editor
      [formly]="formly"
      [model]="formlyModel"
      (onCalc)="getTotalFees($event)"
    />
    <app-bills-expenses-editor
      [formly]="formly"
      [model]="formlyModel"
      (onCalc)="getTotalExpenses($event)"
    />
    <app-bills-summary
      [data]="data"
      (applyDiscountEvent)="onDiscountApplied($event)"
    />
    <div class="flex justify-end gap-4 mt-4">
      <app-shared-button
        styleClass="bg-white border border-grey500 text-grey500 px-8 py-3 text-lg font-medium h-12 leading-5"
        [label]="'common.cancel' | translate"
        (onClick)="cancel()"
      />
      <app-shared-button
        styleClass="bg-primary text-white px-8 py-3 text-lg	font-medium h-12 leading-5"
        [label]="(billIdentifier() ? 'Update Bill' : 'Create Bill') | translate"
        [btnType]="'submit'"
        [isLoading]="isLoading"
      />
    </div>
  </form>
</section>
