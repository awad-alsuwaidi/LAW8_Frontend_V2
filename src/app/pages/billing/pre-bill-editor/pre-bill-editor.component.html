<section>
    <h1 class="text-colorsTextTextPrimary font-bold text-2xl mb-1">
        {{ 'billing.createPreBill' | translate }}
    </h1>
    <form [formGroup]="formly" (ngSubmit)="onSubmit()">
        <app-pre-bill-main-editor [formly]="formly" [model]="formlyModel" (onMatterChange)="onMatterChange($event)" />
        <!-- (onDataLoaded)="onFeesLoaded($event)"  -->
        <app-pre-bill-time-fees-editor [formly]="formly" [model]="formlyModel" (onCalc)="getTotalFees($event)" />
        <app-pre-bill-expenses-editor [formly]="formly" [model]="formlyModel" (onCalc)="getTotalExpenses($event)" />
        <app-pre-bill-summary [data]="data" (applyDiscountEvent)="onDiscountApplied($event)" />
        <div class="flex justify-end gap-4 mt-4">
            <app-shared-button
                styleClass="bg-white border border-grey500 text-grey500 px-8 py-3 text-lg font-medium h-12 leading-5"
                [label]="'common.cancel'|translate" (onClick)="cancel()" />
            <app-shared-button styleClass="bg-primary text-white px-8 py-3 text-lg	font-medium h-12 leading-5"
                [label]="'billing.createPreBill'|translate" [btnType]="'submit'" [isLoading]="isLoading" />

        </div>
    </form>
</section>
