<section class="p-4 md:p-6 space-y-4">
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 md:gap-0 mb-4">
    <div>
      <h1 class="text-2xl md:text-3xl font-bold text-colorsTextTextPrimary">
        All Notifications
      </h1>

      <div class="flex gap-3 mt-2 text-sm">
        <span class="px-3 py-1 rounded-full bg-blue-50 text-blue-700">
          Unread: {{ unreadCount }}
        </span>
        <span class="px-3 py-1 rounded-full bg-greyScale100 text-textSecondary">
          Read: {{ readCount }}
        </span>
      </div>
    </div>

    <app-shared-button
      [icon]="'icon-checks text-primary !text-2xl'"
      [label]="'Mark all as read' | translate"
      [styleClass]="'flex text-blue600 !text-sm !py-1 !px-2 !font-medium !leading-6 w-full md:w-auto justify-center'"
      (onClick)="markAllRead()"
    />
  </div>

  <div class="bg-white p-4 md:p-6 rounded-2xl shadow-md space-y-4">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3" style="display: flex;flex-direction: row-reverse;;">
      <!-- <app-shared-search
        class="w-full sm:w-auto mb-2 sm:mb-0"
        (searchValueChange)="searchValueChange($event)" /> -->

      <app-shared-button
        [icon]="'icon-sort !text-xl !leading-4 mt-1'"
        [label]="'Filter' | translate"
        [styleClass]="'!p-2 border border-grey200 !text-textSecondary !text-sm !font-medium flex justify-center w-full sm:w-auto'"
        (onClick)="openFilterEditor()" />
    </div>

    <div class="overflow-x-auto">
      @if(loading){
  <div class="space-y-3">
    @for(i of [].constructor(10); track $index){
      <div class="flex items-center gap-4 animate-pulse">
        <div class="h-12 w-10 bg-gray-200 rounded-full"></div>
        <div class="flex-1 grid grid-cols-6 gap-4">
          <div class="h-4 bg-gray-200 rounded col-span-1"></div>
          <div class="h-4 bg-gray-200 rounded col-span-2"></div>
          <div class="h-4 bg-gray-200 rounded col-span-1"></div>
          <div class="h-4 bg-gray-200 rounded col-span-1"></div>
          <div class="h-4 bg-gray-200 rounded col-span-1"></div>
        </div>
      </div>
    }
  </div>
} @else {
      <app-shared-table 
        [columns]="columns"
        [data]="data"
        [pagination]="pagination"
        (onPageChange)="onPageChange($event)"
        (onPageChange)="onPageChange($event)"
        (onSort)="onSortChange($event)"
        [selectedRows]="selectedRows"
      >
        <ng-template #customColumn let-rowData>
          <div class="flex gap-3 items-center">
            
            <div class="relative inline-block">
              <!-- @if(rowData.statusId !== notificationStatus.Read){
                <span class="absolute bg-textErrorBase border-white size-2 rounded-full end-0 top-1.5 border"></span>
              } -->
<img
  [src]="getNotificationIconPath(rowData)"
  [alt]="rowData.type || rowData.module"
  class="size-12"
/>    

</div>
            <span class="text-sm font-bold text-textSecondary truncate" style="width: 200px;">
              {{ rowData.lable }}
            </span>
          </div>
        </ng-template>

        <ng-template #columnActions let-rowData>
          <div class="flex gap-2 items-center">
            <app-shared-button
              [icon]="'icon-checks text-primary !text-xl'"
              [label]="(rowData.statusId === notificationStatus.Read ? 'Mark as unread' : '  Mark as read') | translate"
              [styleClass]="'flex text-blue600 !text-sm !py-1 !px-2 !font-medium !leading-6 justify-center'"
              style="width: 160px;"
              (onClick)="toggleRead(rowData)"
            />

            <app-shared-button
              [icon]="'icon-eye text-primary !text-xl'"
              [label]="'View' | translate"
              [styleClass]="'flex text-primary !text-sm !py-1 !px-2 !font-medium !leading-6 justify-center'"
              (onClick)="viewNotification(rowData)"
            />
          </div>
        </ng-template>
      </app-shared-table>
    }

    </div>
  </div>
</section>
