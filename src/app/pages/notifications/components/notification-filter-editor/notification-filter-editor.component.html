@if(loading){
<div class="p-4">
  <div class="space-y-4">
    <div class="h-12 bg-gray-200 rounded animate-pulse"></div>
    <div class="h-12 bg-gray-200 rounded animate-pulse"></div>
    <div class="h-12 bg-gray-200 rounded animate-pulse"></div>
    <div class="h-12 bg-gray-200 rounded animate-pulse"></div>
  </div>
</div>
}@else {
<form class="bg-surfaceLevel2 border-y border-grey100 p-4" [formGroup]="formly" (ngSubmit)="onSubmit()">
    <formly-form [form]="formly" [fields]="formlyFields" [model]="formlyModel" />

    <div class="flex flex-col sm:flex-row gap-3 sm:gap-4 justify-end mt-4">

        <app-shared-button [btnType]="'button'"
            styleClass="bg-white border border-grey500 text-grey500 px-6 py-3 text-base sm:text-lg font-medium h-12 w-full sm:w-auto justify-center"
            [label]="'common.cancel'|translate" (onClick)="_dynamicDialogRef.close()" />

        <app-shared-button [btnType]="'button'"
            styleClass="bg-white border border-primary text-primary px-6 py-3 text-base sm:text-lg font-medium h-12 w-full sm:w-auto justify-center"
            [label]="'common.reset' | translate" (onClick)="reset()" />

        <app-shared-button [btnType]="'submit'"
            styleClass="bg-primary text-white px-6 py-3 text-base sm:text-lg font-medium h-12 w-full sm:w-auto justify-center"
            [label]="'common.applyFilters' | translate" />

    </div>
</form>

}
