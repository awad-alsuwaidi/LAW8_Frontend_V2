<section>
    <h1 class="text-colorsTextTextPrimary font-bold text-2xl mb-1">
        {{ 'menu.receivePayment' | translate }}
    </h1>
    <form [formGroup]="formly" (ngSubmit)="onSubmit()" [requiredPermission]="'Add_ReceivePayment'" >
        <formly-form [form]="formly" [fields]="formlyFields" [model]="formlyModel" />
        <div class="flex justify-end gap-4 mt-4">
            <app-shared-button
                styleClass="bg-white border border-grey500 text-grey500 px-8 py-3 text-lg font-medium h-12 leading-5"
                [label]="'common.cancel'|translate"  />
            <app-shared-button styleClass="bg-primary text-white px-8 py-3 text-lg	font-medium h-12 leading-5"
                [label]="'Submit'|translate" [btnType]="'submit'" [isLoading]="isSubmitted" />

        </div>
    </form>
</section>
