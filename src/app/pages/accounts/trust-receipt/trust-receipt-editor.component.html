 <section>
      <h1 class="text-colorsTextTextPrimary font-bold text-2xl mb-1">
         {{'menu.trustReceipt' | translate }}
      </h1>
      <!-- <p class="text-grey400 text-xs m-0">
        Enter receipt details, then allocate the full amount across matters. Submit is enabled only when Unallocated = 0.
      </p> -->

      <form [formGroup]="formly" (ngSubmit)="onSubmit()">
        <formly-form
          [form]="formly"
          [fields]="formlyFields"
          [model]="formlyModel"
          [options]="formlyOptions">
        </formly-form>

        <div class="flex justify-end gap-4 mt-4">
          <app-shared-button
            styleClass="bg-white border border-grey500 text-grey500 px-8 py-3 text-lg font-medium h-12 leading-5"
            [label]="'common.cancel'|translate">
          </app-shared-button>

          <app-shared-button
            styleClass="bg-primary text-white px-8 py-3 text-lg font-medium h-12 leading-5 disabled:opacity-50"
            [label]="'Submit'|translate"
            [btnType]="'submit'"
            [disabled]="!canSubmit"
            [isLoading]="isLoading">
          </app-shared-button>
        </div>
      </form>
    </section>
