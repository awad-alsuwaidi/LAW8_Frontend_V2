@if(isLoading){

<app-shared-skeleton-grid [styleClass]="'grid grid-cols-3 gap-6'" [size]="12" />
}@else {
<form class="mt-2 p-lg-2" [formGroup]="formly" (ngSubmit)="onSubmit()">
    <formly-form [form]="formly" [fields]="formlyFields" [model]="formlyModel"></formly-form>
    <div class="flex gap-4 justify-end mt-4 py-4">
        <app-shared-button [btnType]="'button'"
            styleClass="bg-white border border-grey500 text-grey500 px-8 py-3 text-lg font-medium h-12 leading-5"
            [label]="'common.reset' | translate" (onClick)="reset()" />

        <app-shared-button styleClass="bg-primary text-white px-8 py-3 text-lg	font-medium h-12 leading-5"
            [label]="'report.generateReport' | translate" [isLoading]="isLoading" [btnType]="'submit'" />
    </div>
</form>

<ng-container *ngIf="urlSafe">
    <iframe [src]="urlSafe" frameborder="0" width="100%" height="800"></iframe>
</ng-container>
}
