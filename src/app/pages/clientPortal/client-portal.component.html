<div class="grid grid-cols-1 lg:grid-cols-6 gap-4">
    <!-- Sidebar (Users List) -->
    <div class="lg:col-span-2 col-span-1">
        <div class="flex justify-between items-center p-3 rounded-t-lg bg-white shadow-md h-14">
            <h1 class="font-bold text-lg md:text-2xl text-colorsTextTextPrimary leading-7 md:leading-9">
                {{"menu.clientportal" | translate}}
            </h1>
        </div>

        <!-- Search -->
        <div class="my-3 px-2">
            <app-shared-search (searchValueChange)="searchValueChange($event)" />
        </div>

        <!-- User List -->
        @if(isLoading){
        <div class="space-y-4 animate-pulse">
            <div class="h-12 bg-gray-200 rounded"></div>
            <div class="h-12 bg-gray-200 rounded"></div>
            <div class="h-12 bg-gray-200 rounded"></div>
            <div class="h-12 bg-gray-200 rounded"></div>
            <div class="h-12 bg-gray-200 rounded"></div>
            <div class="h-12 bg-gray-200 rounded"></div>
            <div class="h-12 bg-gray-200 rounded"></div>
            <div class="h-12 bg-gray-200 rounded"></div>
            <div class="h-12 bg-gray-200 rounded"></div>
            <div class="h-12 bg-gray-200 rounded"></div>
            <div class="h-12 bg-gray-200 rounded"></div>
            <div class="h-12 bg-gray-200 rounded"></div>
            
        </div>
        }
        @else {
        <div class="flex flex-col gap-2 px-2">
            @for(user of data; track $index){
            <a href="javascript:void(0)" [routerLink]="['/portal/view', user.id]" [routerLinkActive]="'active'"
                class="flex justify-between items-center py-3 px-3 rounded-lg border border-gray-200 bg-gray-50 hover:bg-white transition-colors duration-300 cursor-pointer relative before:h-0 before:w-0 before:bg-primary before:rounded-full before:absolute before:top-2.5 before:-start-1.5 before:transition-all before:duration-300 hover:before:h-4/6 hover:before:w-1">

                <div class="flex items-center gap-3">
                    <img [src]="'assets/images/user-avatar.svg'" alt="User"
                        class="w-10 h-10 rounded-full border border-gray-200"
                        onerror="this.src='assets/images/user-avatar.svg'" />
                    <div>
                        <h1 class="font-semibold text-sm md:text-base text-textSecondary">
                            {{ user.name }}
                        </h1>
                        <p class="text-xs md:text-sm text-grey500">
                            {{ user.title }}
                        </p>
                    </div>
                </div>

                <div class="text-right">
                    <h1 class="font-bold text-xs md:text-sm text-colorsTextTextPrimary">
                        {{ user.depart }}
                    </h1>
                    <p class="text-xs text-grey500">
                        {{ user.timeSheetDate | date: 'dd/MM/yyyy' }}
                    </p>
                </div>
            </a>
            }

            <!-- Pagination -->
            <div class="mt-3">
                <p-paginator [dir]="'ltr'" (onPageChange)="onPageChange($event)" [first]="first" [rows]="10"
                    pageLinkSize="3" [totalRecords]="pagination?.totalElements" [showCurrentPageReport]="true"
                    currentPageReportTemplate="Total {totalRecords}">
                </p-paginator>
            </div>
        </div>
        }
    </div>
    <!-- Content Section -->
    <div class="lg:col-span-4 col-span-1 bg-white rounded-lg shadow-md p-4">
        <router-outlet />
    </div>
</div>
