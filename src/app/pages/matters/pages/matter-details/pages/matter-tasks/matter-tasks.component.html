@if(isLoading){
<div class="w-full h-screen p-6 animate-pulse">
  <div class="overflow-x-auto">
    <table class="w-full border-collapse">
      <thead>
        <tr>
          <th class="px-4 py-3">
            <div class="h-6 w-24 bg-gray-200 rounded"></div>
          </th>
          <th class="px-4 py-3">
            <div class="h-6 w-32 bg-gray-200 rounded"></div>
          </th>
          <th class="px-4 py-3">
            <div class="h-6 w-20 bg-gray-200 rounded"></div>
          </th>
          <th class="px-4 py-3">
            <div class="h-6 w-28 bg-gray-200 rounded"></div>
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let i of [1,2,3,4,5,6,7,8]">
          <td class="px-4 py-4 border-t">
            <div class="h-5 w-24 bg-gray-200 rounded"></div>
          </td>
          <td class="px-4 py-4 border-t">
            <div class="h-5 w-32 bg-gray-200 rounded"></div>
          </td>
          <td class="px-4 py-4 border-t">
            <div class="h-5 w-20 bg-gray-200 rounded"></div>
          </td>
          <td class="px-4 py-4 border-t">
            <div class="h-5 w-28 bg-gray-200 rounded"></div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

}
@else {

<section class="bg-white p-6 rounded-2xl ">
  <div class="flex justify-between">
    <h1 class="font-bold text-grey500 text-lg">{{ 'matters.allTasks' | translate }}</h1>
    <div class="flex gap-4">
      @if(!_router.url.includes('inactive')){
      <app-shared-button [icon]="'icon-add-circle text-grey500 !text-2xl '" [label]="'matters.addTaskGroup' | translate"
        [styleClass]="
              'flex text-grey500 !text-sm !py-1 !px-0 !font-medium !leading-8'
            " (onClick)="openTaskGroupEditor()" [requiredPermission]="'Add_TaskManagement'" />
      <app-shared-button [icon]="'icon-add-circle text-primary !text-2xl '" [label]="'matters.addTask' | translate"
        [styleClass]="
              'flex text-blue600 !text-sm !py-1 !px-0 !font-medium !leading-8'
            " (onClick)="openTaskEditor()" [requiredPermission]="'Add_TaskManagement'" />
      }
    </div>
  </div>
  <app-shared-table [columns]="columns" [data]="data" [pagination]="pagination" [statusConfig]="priorityConfig" (onSort)="onSort($event)"
    (onPageChange)="onPageChange($event)">

    <ng-template #customColumn let-rowData let-rowIndex="rowIndex">
      <p-menu #menu [model]="statusItems" [popup]="true" appendTo="body">
        <ng-template pTemplate="content" let-item>
          <div class="flex flex-col p-0 w-full">
            <div class="p-2 cursor-pointer hover:bg-blue-50 flex items-center gap-2"
              (click)="updateStatus(item['value'], rowData); menu.hide()">
              <p-radioButton [name]="'status_'+rowIndex" [ngModel]="rowData.status" [value]="item['value']"
                [inputId]="'status_' + rowIndex + '_' + item['value']" />
              <label [for]="'status_' + rowIndex + '_' + item['value']" class="cursor-pointer w-full">
                {{ item.label }}
              </label>
            </div>
          </div>
        </ng-template>
      </p-menu>
      <div class="relative inline-block">
        @if (rowData.haveAttachment) {
        <img src="/assets/images/icons/attachment.svg" alt="Attachment" class="absolute end-0 -top-1">
        }
        <app-shared-status [label]="rowData.statusName" [data]="rowData.status" [statusConfig]="statusConfig"
          (click)="menu.toggle($event);" />
      </div>
    </ng-template>
    @if(!_router.url.includes('inactive')){
    <ng-template #columnActions let-rowData let-rowIndex="rowIndex">
      <div class="font-medium text-sm text-textSecondary rounded-e-lg">
        <div class="flex gap-6" title="View Details" [requiredPermission]="'View_TaskManagement'">
          <div class="cursor-pointer icon-show text-base" (click)="openTaskEditor(rowData,'view')">

          </div>
          <div class="cursor-pointer" (click)="openTaskEditor(rowData,'edit')" title="Edit"
            [requiredPermission]="'Update_TaskManagement'">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
              class="stroke-grey500 stroke-2">
              <path
                d="M11 2.00012H9C4 2.00012 2 4.00012 2 9.00012V15.0001C2 20.0001 4 22.0001 9 22.0001H15C20 22.0001 22 20.0001 22 15.0001V13.0001"
                stroke-linecap="round" stroke-linejoin="round" />
              <path
                d="M16.0399 3.02013L8.15988 10.9001C7.85988 11.2001 7.55988 11.7901 7.49988 12.2201L7.06988 15.2301C6.90988 16.3201 7.67988 17.0801 8.76988 16.9301L11.7799 16.5001C12.1999 16.4401 12.7899 16.1401 13.0999 15.8401L20.9799 7.96013C22.3399 6.60013 22.9799 5.02013 20.9799 3.02013C18.9799 1.02013 17.3999 1.66013 16.0399 3.02013Z"
                stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M14.9102 4.15015C15.5802 6.54015 17.4502 8.41015 19.8502 9.09015" stroke-miterlimit="10"
                stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>
          <div class="cursor-pointer" (click)="onDelete(rowData)" title="Delete"
            [requiredPermission]="'Delete_TaskManagement'">
            <i class="icon-trash text-base text-grey500"></i>
          </div>
        </div>
      </div>
    </ng-template>
    }

  </app-shared-table>
</section>}
