<form [formGroup]="formly" (ngSubmit)="onSubmit()">
  <div class="bg-surfaceLevel2 border-y border-grey100 p-4">

    @if(isEdit && !formlyOptions.formState.changeAttachment){

  @if(isLoading){
    <div class="flex items-center justify-between mb-4 p-3 border border-grey100 rounded-lg bg-white animate-pulse">
      <div class="flex flex-col gap-2 w-1/2">
        <div class="h-4 w-32 bg-gray-200 rounded"></div>
        <div class="h-4 w-64 bg-gray-200 rounded"></div>
      </div>

      <div class="flex gap-3">
        <div class="h-9 w-20 bg-gray-200 rounded"></div>
        <!-- <div class="h-9 w-32 bg-gray-200 rounded"></div> -->
      </div>
    </div>
  }

  @else if(existingAttachmentPath){
    <div class="flex items-center justify-between mb-4 p-3 border border-grey100 rounded-lg bg-white">
      <div class="flex flex-col">
        <span class="text-sm text-grey500"> {{ 'matters.currentattachment' | translate }}</span>
        <span class="text-sm font-semibold truncate max-w-[420px]">
          {{ existingAttachmentName || 'Attachment' }}
        </span>
      </div>

      <div class="flex gap-3">
        <app-shared-button
          [btnType]="'button'"
          styleClass="bg-white border border-grey500 text-grey500 px-4 py-2 text-sm"
          [label]="'matters.view'|translate"
          (onClick)="viewExistingAttachment()"
        />
    <!-- <app-shared-button
            [btnType]="'button'"
            styleClass="bg-white border border-grey500 text-grey500 px-4 py-2 text-sm"
            label="Download"
            (onClick)="downloadExistingAttachment()"
          /> -->

        <!-- <app-shared-button
          [btnType]="'button'"
          styleClass="bg-red text-white px-4 py-2 text-sm"
          [label]="'matters.changeAttachment'|translate"
          (onClick)="enableChangeAttachment()"
          style="background-color: #cf2323; border-radius: 6px;"
        /> -->
        
      </div>
    </div>
  }

}


    <!-- @if(isEdit && formlyOptions.formState.changeAttachment){
      <div class="flex justify-end mb-4">
        <app-shared-button
          [btnType]="'button'"
          styleClass="bg-white border border-grey500 text-grey500 px-4 py-2 text-sm"
          [label]="'matters.cancelChange'|translate"
          (onClick)="cancelChangeAttachment()"
        />
      </div>
    } -->

    <formly-form
      [form]="formly"
      [fields]="formlyFields"
      [model]="formlyModel"
      [options]="formlyOptions"  
    />
  </div>

  <div class="flex gap-4 justify-end mt-4 px-4 pb-4">
    <app-shared-button
      [btnType]="'button'"
      styleClass="bg-white border border-grey500 text-grey500 px-8 py-3 text-lg font-medium h-12 leading-5"
      [label]="'common.cancel'|translate"
      (onClick)="_dynamicDialogRef.close()"
    />
    <app-shared-button
      [btnType]="'submit'"
      styleClass="bg-primary text-white px-8 py-3 text-lg font-medium h-12 leading-5"
      [label]="'common.save'|translate"
      [isLoading]="isLoading"
    />
  </div>
</form>
