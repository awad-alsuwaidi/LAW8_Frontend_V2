@if (isLoading) {
  <div class="space-y-4 animate-pulse">
    <div class="h-12 bg-gray-200 rounded"></div>
    <div class="h-12 bg-gray-200 rounded"></div>
    <div class="h-12 bg-gray-200 rounded"></div>
    <div class="h-12 bg-gray-200 rounded"></div>
    <div class="h-12 bg-gray-200 rounded"></div>
    <div class="flex justify-end gap-4 mt-4">
      <div class="h-12 w-28 bg-gray-300 rounded"></div>
      <div class="h-12 w-28 bg-gray-300 rounded"></div>
    </div>
  </div>
} @else {
  <form [formGroup]="formly" (ngSubmit)="onSubmit()">
    <formly-form
      [form]="formly"
      [fields]="formlyFields"
      [model]="formlyModel"
      [options]="formlyOptions"
    />

    <!-- Attendance Section - Shows only in Edit Mode when Activity Type = 4 -->
    @if (!isViewMode && formlyModel.law_ActivityTypeId === 4) {
      <div class="grid gap-4 md:grid-cols-3 bg-white rounded-2xl p-6">
        <div class="col-span-2">
          <h6 class="text-sm text-grey500 font-medium mt-3 my-2">
            {{ "Attendance" | translate }}
          </h6>
          @for (item of formlyModel.users || []; track $index) {
            <div
              class="flex justify-between bg-grey50 mb-2 p-4 border-grey100 rounded-lg"
            >
              <p class="text-sm text-textSecondary font-medium">
                {{ item?.label }}
              </p>
              <span
                class="cursor-pointer icon-trash text-grey500"
                (click)="deleteItem(item)"
              ></span>
            </div>
          }
        </div>
      </div>
    }

    <!-- Action Buttons -->
            <div class="flex gap-4 justify-end mt-4 px-4 pb-4">
            <app-shared-button
                styleClass="bg-white border border-grey500 text-grey500 px-8 py-3 text-lg font-medium h-12 leading-5"
                [label]="'common.cancel'|translate" (onClick)="_dynamicDialogRef.close()" />
            @if(formlyOptions.formState.readonly){
            <app-shared-button
                styleClass="text-primary border border-primary px-8 py-3 text-lg font-medium h-12 leading-5"
                [label]="'common.edit' | translate" [btnType]="'button'" (onClick)="switchToEditMode()" />
            }
            @else if(!mode){
            <app-shared-button styleClass="bg-primary text-white px-8 py-3 text-lg	font-medium h-12 leading-5"
                [label]="'common.save'|translate" [btnType]="'submit'" />
            }@else{
            <app-shared-button styleClass="bg-primary text-white px-8 py-3 text-lg	font-medium h-12 leading-5"
                [label]="'common.update' | translate" [btnType]="'submit'" />
            }
        </div>
  </form>
}
