@if(data.length==0){
<app-shared-empty-section [emptyConfig]="emptyConfig" />
}@else {

<section class="bg-white p-6 rounded-2xl">
    <div class="flex justify-between">
        <h1 class="text-lg font-bold text-grey500">Class</h1>
        @if(!_router.url.includes('inactive')){

        <app-shared-button [icon]="'icon-add-circle text-primary !text-2xl '"
            [requiredPermission]="'Add_Matter_Classes'" [label]="'matters.addNewClass' | translate" [styleClass]="
              'flex text-blue600 !text-sm !py-1 !px-0 !font-medium !leading-8'
            " (onClick)="openAddClassEditor()" />
        }
    </div>
    <app-shared-table [columns]="columns" [data]="data" [pagination]="pagination" (onPageChange)="onPageChange($event)">
        @if(!_router.url.includes('inactive')){
        <ng-template #columnActions let-rowData let-rowIndex="rowIndex">
            <div class="font-medium text-sm text-textSecondary  rounded-e-lg w-14">
                <div class="flex gap-6 w-14">

                    <div class="cursor-pointer" [requiredPermission]="'Update_Matter_Classes'"
                        (click)="openUpdateClassEditor(rowData)">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                            class="stroke-grey500 stroke-2">
                            <path
                                d="M11 2.00012H9C4 2.00012 2 4.00012 2 9.00012V15.0001C2 20.0001 4 22.0001 9 22.0001H15C20 22.0001 22 20.0001 22 15.0001V13.0001"
                                stroke-linecap="round" stroke-linejoin="round" />
                            <path
                                d="M16.0399 3.02013L8.15988 10.9001C7.85988 11.2001 7.55988 11.7901 7.49988 12.2201L7.06988 15.2301C6.90988 16.3201 7.67988 17.0801 8.76988 16.9301L11.7799 16.5001C12.1999 16.4401 12.7899 16.1401 13.0999 15.8401L20.9799 7.96013C22.3399 6.60013 22.9799 5.02013 20.9799 3.02013C18.9799 1.02013 17.3999 1.66013 16.0399 3.02013Z"
                                stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round" />
                            <path d="M14.9102 4.15015C15.5802 6.54015 17.4502 8.41015 19.8502 9.09015"
                                stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>
                    <div class="cursor-pointer" [requiredPermission]="'Delete_Matter_Classes'"
                        (click)="onDelete(rowData)">
                        <i class="icon-trash text-base text-grey500"></i>
                    </div>
                </div>
            </div>
        </ng-template>
        }
    </app-shared-table>
</section>
}

@if(_router.url.includes('add')){

<div class="flex gap-4 justify-end mt-4 px-4 pb-4">
    <app-shared-button [btnType]="'button'"
        styleClass="bg-white border border-grey500 text-grey500 px-8 py-3 text-lg font-medium h-12 leading-5"
        [label]="'common.cancel'|translate" (onClick)="matterDetailsEditorComponent.cancel()" />
    <app-shared-button (onClick)="matterDetailsEditorComponent.onSubmit()" [requiredPermission]="'Update_Matter'"
        styleClass="bg-primary text-white px-8 py-3 text-lg font-medium h-12 leading-5"
        [label]="'matters.save'| translate " [isLoading]="matterDetailsEditorComponent.isLoading" />
</div>
}
