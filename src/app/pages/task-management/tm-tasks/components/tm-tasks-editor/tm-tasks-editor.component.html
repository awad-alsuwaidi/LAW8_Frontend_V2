
@if(isLoading){
<app-shared-skeleton-grid [styleClass]="'grid grid-cols-2 gap-6 p-4'" [size]="9" />
}@else {
  <form  [formGroup]="formly" (ngSubmit)="onSubmit()">
    <div class="bg-surfaceLevel2 border-y border-grey100 p-4">
        <formly-form [form]="formly" [fields]="formlyFields" [model]="formlyModel" [options]="formlyOptions"/>
    </div>
    <div class="flex gap-4 justify-end mt-4 px-4 pb-4">

        <app-shared-button
        [btnType]="'button'"
        styleClass="bg-white border border-grey500 text-grey500 px-8 py-3 text-lg font-medium h-12 leading-5"
        [label]="'common.cancel' | translate"
        (onClick)="_dynamicDialogRef.close()" />
      
      @if(formlyOptions.formState.readonly){
        <app-shared-button
          styleClass="text-primary border border-primary px-8 py-3 text-lg	font-medium h-12 leading-5"
          [label]="'common.edit' | translate"
          [btnType]="'button'"
          (onClick)="onEdit()" />
      }
      @else if(!mode){
        <app-shared-button
          styleClass="bg-primary text-white px-8 py-3 text-lg	font-medium h-12 leading-5"
          [label]="'common.save' | translate"
          [isLoading]="isSubmitted"
          [btnType]="'submit'" />
      }
      @else{
        <app-shared-button
          styleClass="bg-primary text-white px-8 py-3 text-lg	font-medium h-12 leading-5"
          [label]="'common.update' | translate"
          [isLoading]="isSubmitted"
          [btnType]="'submit'" />
      }
    </div>
</form>
}
