<div class="px-6 py-2 bg-grey50 my-4 flex justify-between gap-4">
    <div class="flex gap-2 overflow-auto">
        @for(key of filterKeys; track $index) {
        <span class="text-sm text-greyscale600 font-medium me-4 self-center">{{key}}:</span>
        @for (item of filter[key]; track $index) {
        <p class="border border-grey200 rounded-full px-2 py-1 text-xs text-greyscale600 font-medium flex items-center gap-2 mr-2 min-w-max bg-white">
            <span>{{item.label}}</span>

            <span class="icon-trash cursor-pointer bg-[#C1C7C8] text-grey500 size-6 rounded-full text-center !leading-6 inline-block" (click)="updateFilter(key,item)"></span>
        </p>
        }
        }


    </div>
    <div class="shrink-0">

        <app-shared-button [btnType]="'button'" styleClass=" text-textSecondary !px-0 !py-0 text-xs font-medium"
            [label]=" 'Reset Filters'" (onClick)="reset()" />
    </div>
</div>
