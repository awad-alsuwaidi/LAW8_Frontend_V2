@if (isLoading) {

<div class="w-full min-h-[85vh] p-6 animate-pulse flex flex-col gap-6">

  <div class="flex justify-between items-center">
    <div class="h-7 w-40 bg-gray-200 rounded"></div>

    <div class="flex gap-4">
      <div class="h-9 w-28 bg-gray-200 rounded-full"></div>
      <div class="h-9 w-28 bg-gray-200 rounded-full"></div>
      <div class="h-9 w-28 bg-gray-200 rounded-full"></div>
    </div>
  </div>

  <div class="bg-white rounded-2xl shadow-sm p-6 flex-1">


    <div class="flex justify-between mb-4">
      <div class="flex gap-3 justify-start">
        <div class="h-8 w-20 bg-gray-200 rounded-full"></div>
      </div>
      <div class="flex gap-3 justify-center">
        <div class="h-8 w-16 bg-gray-200 rounded-full"></div>
      </div>
      <div class="flex gap-3 justify-end">
        <div class="h-8 w-16 bg-gray-200 rounded-full"></div>
        <div class="h-8 w-16 bg-gray-200 rounded-full"></div>
        <div class="h-8 w-16 bg-gray-200 rounded-full"></div>
        <div class="h-8 w-16 bg-gray-200 rounded-full"></div>
      </div>
    </div>
    <div class="grid grid-cols-7 gap-3">
      <div *ngFor="let i of [].constructor(42)" class="h-28 bg-gray-100 rounded-md border border-gray-200">
      </div>
    </div>

  </div>

</div>

}
@else {

<section>
  <div class="flex justify-between mb-2">
    <h1 class="font-bold text-2xl">{{'common.calendar'| translate}}</h1>
    <div class="flex gap-4">
      <app-calender-filter (onFilter)="onFilter($event)" [formlyModel]="filter" />
      <app-shared-button [label]="'matters.addActivity' | translate"
        [styleClass]="'bg-primary text-white !h-8 !leading-[0.5] !text-xs'" (onClick)="openActivityEditor()" />
    </div>

  </div>
  @if(filter){
  <app-calender-filter-chips
  [coloredKey]="'user'"
  [filter]="filter"
  [usersLookup]="usersLookup"
  [activityLookup]="activityLookup"
  [currentUserId]="currentUserId"
  (onFilterUpdate)="onFilterUpdate($event)" />

  }
  <div class="bg-white px-4 py-6 rounded-2xl">
    @if(calendarOptions){
    <full-calendar #fullCalendar [options]="calendarOptions" />
    }
  </div>
</section>}
