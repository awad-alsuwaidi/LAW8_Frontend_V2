
<div class=" bg-white p-6 rounded-lg mb-4">
    <div class="flex justify-between">
        <h5 class="text-grey500 mb-8 text-lg font-bold"> {{'Account Integration'|translate}}</h5>
<app-shared-button
                styleClass="bg-primary text-white px-8 py-3 text-lg font-medium h-12 leading-5"
               [label]="'Add To SAP'|translate" (onClick)="AddToSap()"/>
    </div>
    <form  [formGroup]="formly" (ngSubmit)="onSubmit()">
        <formly-form [form]="formly" [fields]="formlyFields" [model]="formlyModel" />
        
        <div class="flex gap-4 justify-end mt-4 px-4 pb-4">
            <app-shared-button [btnType]="'button'"
                styleClass="border border-grey500 text-grey500 px-8 py-3 text-lg font-medium h-12 leading-5"
                [label]="'common.reset'|translate" (onClick)="reset()" />
            <app-shared-button [btnType]="'submit'"
                styleClass="bg-primary text-white px-8 py-3 text-lg font-medium h-12 leading-5"
               [label]="'common.save'|translate" [isLoading]="isLoading"/>
        </div>
    </form>
</div>
